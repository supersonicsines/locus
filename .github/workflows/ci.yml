name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The package must hold only what's meant to ship.
      - run: npm pack --dry-run

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t locus .
      - name: The image starts and answers
        run: |
          docker run -d --name locus -p 4747:4747 locus
          for i in $(seq 1 30); do curl -sf http://localhost:4747/api/info && exit 0; sleep 1; done
          docker logs locus; exit 1
